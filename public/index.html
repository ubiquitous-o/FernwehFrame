<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NowWhereFrom</title>
<meta name="description" content="Three live windows to elsewhere. YouTube live cameras behind an IKEA RÖDALM triptych frame — one monitor, three views of the world.">
<meta property="og:title" content="NowWhereFrom">
<meta property="og:description" content="Three live windows to elsewhere. One monitor behind a triptych frame, three live cameras from around the world.">
<meta property="og:url" content="https://ubiquitous-o.github.io/NowWhereFrom/">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪟</text></svg>">
<!-- 起動で必ず叩くホストの握手(DNS+TCP+TLS)を前倒し + 必須JSONを並行取得 -->
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://s.ytimg.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://www.google.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="videos.json" as="fetch" crossorigin>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- RÖDALM 3窓のステージ。窓DOMは#window-templateからmain.jsが生成し、
     位置・サイズはlayout.jsがmm実寸→pxで算出、Cキーのキャリブレーションで追い込む -->
<div id="stage"></div>

<template id="window-template">
  <div class="frame-window">
    <div class="win-card">
      <div class="win-video-box"><div class="win-video"></div></div>
      <div class="win-caption">
        <div class="win-title"></div>
        <div class="win-meta">
          <span class="win-location"></span>
          <span class="win-time"></span>
        </div>
      </div>
    </div>
    <div class="cal-rect cal-aperture"></div>
    <div class="win-frost"></div>
    <div class="win-label"></div>
  </div>
</template>

<!-- キャリブレーションUI（Cキーでトグル）。額縁で隠れないよう窓2の上にJSが配置する -->
<div id="cal-help">
  <div class="cal-title">CALIBRATION</div>
  <pre id="cal-readout"></pre>
  <div id="cal-input-row">
    <label for="cal-input" id="cal-input-label">MONITOR WIDTH (mm):</label>
    <input id="cal-input" type="number" min="100" max="3000" step="0.5">
  </div>
  <pre class="cal-keys">
0        select all (frame)
1 / 2 / 3  select window
arrows   move        (+Shift x10)
- / =    scale | width
[ / ]    height
M        monitor width (mm) = true scale
R        reset
C / Esc  save &amp; exit</pre>
  <pre id="cal-guides" class="cal-keys"></pre>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
